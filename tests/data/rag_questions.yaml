# Retrieval questions with known answers, for tests/test_rag.py.
#
# Written BEFORE the search code, phrased the way a user would ask (not copied
# from the headings), from things this project has verified. A question passes
# at k if any of its `expect` entries matches one of the top-k hits: `source`
# must end the hit's source path, and `title` (if given) must appear in the
# hit's section title (case-insensitive).
#
# set: repo    -- our docs + knowledge base + papers.yaml (always indexed)
#      curated -- docs/lammps-rag.md, the committed LAMMPS subset (always indexed)
#      manual  -- the full LAMMPS manual and examples (needs a built index from a
#                 LAMMPS checkout; skipped otherwise)

