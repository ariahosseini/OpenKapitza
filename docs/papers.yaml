- key: yeh2001
  cite: C. L. Yeh, C. Y. Wen, Y. F. Chen, S. H. Yeh & C. H. Wu, "An experimental investigation of thermal contact conductance across bolted joints", Exp. Therm. Fluid Sci. 25, 349-357 (2001)
