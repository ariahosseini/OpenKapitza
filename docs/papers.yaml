- key: lu2019mtm
  cite: 'Z. Lu, J. Shi & X. Ruan, "Role of phonon coupling and non-equilibrium near the interface to interfacial thermal resistance: the multi-temperature model and thermal circuit", J. Appl. Phys. 125, 085107 (2019)'
  status: full
  topics: [Si/Ge, phonon non-equilibrium, multi-temperature model, extraction]
  findings: >
    Branch-resolved diffusion model (not MD): Si/Ge h = 375.1 vs 396.6 MW/m2K
