# Papers this project used or needs: our own notes, not the papers' text.
#
# One entry per source, written in our words: what it is, what we took from
# it, what we checked, and the pitfalls found. The public repository must not
# carry copyrighted text, so quote nothing longer than a short phrase, and
# never paste figures, tables or equations wholesale; record WHERE they are.
#
# status:  full    -- full text read (supplied PDF or open access)
#          partial -- abstract, or the parts reachable here
#          needed  -- located but not obtained; what it would close is in `needed_for`
# kb:      knowledge-base sections that discuss it (docs/knowledge-base.md)
# Indexed by openkapitza.rag (collection "papers").

- key: milanez2004
  cite: F. H. Milanez, M. M. Yovanovich & M. B. H. Mantelli, "Thermal Contact Conductance at Low Contact Pressures", J. Thermophys. Heat Transfer 18(1), 2004 (AIAA 36th Thermophysics Conf., 2003)
  status: full
  topics: [light load, truncated Gaussian, contact hardness, unloading, hysteresis, CMY]
  used_for: contact/truncated.py (Eqs. 10-11, 14-15) and contact/unloading.py (Eqs. 16-19)
  findings: >
    Truncated-Gaussian (TG) asperity heights explain why CMY under-predicts at
    light load; fitted truncation levels 3.5-4.2 sigma for bead-blasted SS 304
    and Ni 200 (their Table 1), RMS error 21-48 % -> 5-18 % (Table 2).
    Checked here: Table 1 contact hardness reproduced within 2.2 %; S1 data
    20.8 -> 15.5 % RMS. Pitfalls: equations unreadable in the text layer (read
    page images); the Eq. 10 correlation is 7 % low at P/H_c = 1e-6 (they claim
    4 %); "f > 40 -> < 1 %" is 1.1 % at f = 40; z_trunc is tied to the c1/c2 it
    was fitted with; Eq. 18 as printed leaves ~60 % of spots in contact at full
    separation (the derived form n*(lambda_max + Z^2) is used); TG unloading
    only above ~300-400 kPa in their tests.
  kb: ["12.1", "12.12"]

- key: milanez2003trunc
  cite: F. H. Milanez, M. M. Yovanovich & J. R. Culham, "Effect of Surface Asperity Truncation on Thermal Contact Conductance", IEEE Trans. Components and Packaging Technologies 26(1), 48-54, 2003
  status: partial
  topics: [light load, truncation, CMY under-prediction]
  findings: >
    Origin of the truncated-Gaussian idea: real surfaces lack asperities above
    ~4.5 sigma, so at light loads CMY under-predicts by 40-70 % (bead-blasted
    SS 304, 16 kPa). Source of the light-load flag's literature range.
  kb: ["8.1"]

- key: bahrami2004thesis
  cite: M. Bahrami, "Modeling of Thermal Joint Resistance for Sphere-Flat Contacts in a Vacuum", PhD thesis, University of Waterloo, 2004
  status: full
  topics: [benchmark data, Hegazy, Antonetti, Nho, McWaid, crowned contact, flatness, macro constriction, sphere-flat]
  used_for: >
    tests/benchmarks/joint_conductance.csv (Hegazy, Tables A.39, A.46-A.54),
    joint_conductance_ext.csv (A.40-A.43, A.63-A.73), nonconforming.csv
    (A.2-A.38); contact/macro.py (Eqs. 3.30, 4.2, 4.6, 4.23, 4.30)
  findings: >
    Appendix A tabulates 36 conforming and 36 non-conforming vacuum datasets.
    Our CMY reproduces his model column within 3 %; 207 + 158 conforming
    points at 1.03 / 0.95 geometric mean. Crowned joints: CMY + macro
    constriction 1.03, 15.3 % RMS; ignoring flatness over-predicts h ~7x (up
    to ~125x). Flat-joint criterion B = a_L/b_L >= 0.8 (delta/sigma ~3-30).
    Pitfalls: Table A.2 rows are not in data-table order (match by name); R_exp
    printed to 2 decimals (exclude rows rounded > 10 %); Nho's ground surfaces
    are anisotropic.
  kb: ["12.3", "12.8"]

