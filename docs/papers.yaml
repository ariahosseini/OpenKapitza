# ---- 31 Oct 2026: potential limits, accuracy and methodology (KB 22) ----

- key: feng2023review
  cite: T. Feng, H. Zhou, Z. Cheng, L. S. Larkin & M. R. Neupane, "A Critical Review of Thermal Boundary Conductance across Wide and Ultrawide Bandgap Semiconductor Interfaces", ACS Appl. Mater. Interfaces 15, 29655-29673 (2023)
  status: full
  topics: [review, MD accuracy, potentials, GaN, SiC, AlN, diamond, Ga2O3, DMM, AGF, MLMD]
  findings: >
    MD of ideal interfaces runs consistently above experiment: GaN/SiC ~520 vs
    ~230 measured, GaN/AlN 1150-1300 vs ~620, Si/diamond ~380 vs ~64 (flat).
    Potential choice alone spread GaN/AlN over 496-2440. DMM/AMM are elastic
    limits, not upper bounds. Causes: mixing-rule potentials, perfect
    interfaces, small domains, missing inelastic and e-ph channels.
    Recommends DFT/experiment-calibrated potentials (MLMD), TEM-validated
    structures, spectral analysis, same-sample comparisons.
  kb: ["22"]

- key: feng2019
  cite: T. Feng, Y. Zhong, J. Shi & X. Ruan, "Unexpected high inelastic phonon transport across solid-solid interface", Phys. Rev. B 99, 045301 (2019)
  status: full
  topics: [Si/Ge, Tersoff, NEMD, length convergence, inelastic, modal temperature, thermostat damping]
  findings: >
    Si/Ge Tersoff NEMD nearly converged at 152 nm: ~4.5e8 W/m2K (28Si/73Ge,
    300 K). Ge potential rescaled to the Si lattice (no strain) because
    averaged lattice constants caused large interface vibrations. Langevin
    +-30 K, damping 0.5 ps (<0.01 ps unstable, >10 ps no gradient). Phonons
    above the Ge cutoff carry ~45 % (abstract: >50 %); optical >= 35 %.
    Modal temperatures spread widely near the interface. Fully classical.
  kb: ["8.3", "17", "22"]

- key: hahn2015aemd
  cite: K. R. Hahn, M. Puligheddu & L. Colombo, "Thermal boundary resistance at Si/Ge interfaces determined by approach-to-equilibrium molecular dynamics simulations", arXiv:1504.03613 (Phys. Rev. B 91, 195313, 2015)
  status: full
  topics: [Si/Ge, Tersoff, AEMD, size dependence, intermixing, rectification]
  findings: >
    AEMD (periodic, two interfaces) with Tersoff: R_I = R_inf (1 + lambda/L),
    R_inf = 3.76e-9 m2K/W (h ~266 MW/m2K), lambda = 167 nm. Intermixed layer
