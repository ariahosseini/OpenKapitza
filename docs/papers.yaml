- key: hopkins2010
  cite: P. E. Hopkins, L. M. Phinney, J. R. Serrano & T. E. Beechem, "Effects of surface roughness and oxide layer on the thermal boundary conductance at aluminum/silicon interfaces", Phys. Rev. B 82, 085307 (2010)
  status: full
  topics: [Al/Si, thermal boundary conductance, TDTR, native oxide, roughness, Kapitza validation]
  used_for: tests/benchmarks/kapitza_measured.csv (Table I)
  findings: >
    Eight Al(80 nm)/Si(100) interfaces: 158-193 MW/m2K with the native oxide
    stripped, 115-144 with it; h falls with roughness in both classes; the
    oxide adds ~1.7e-9 m2K/W (their Eq. 4 fit; plain pairwise 1.91e-9). Our
    Debye DMM (321) is 1.66x the best interface: an upper estimate.
  kb: ["7", "12.5"]

- key: devoto2017
  cite: D. DeVoto, J. Major, P. Paret, G. S. Blackman, A. Wong & J. S. Meth, "Degradation Characterization of Thermal Interface Greases", NREL/CP-5400-68014 (ITherm 2017)
  status: full
  topics: [TIM, grease, ASTM D5470, bond line thickness, boundary resistance, pump-out]
  used_for: tests/benchmarks/tim_greases.csv (Tables 1-3); grease class range floor 10 mm2K/W
  findings: >
    Five greases fit R = BLT/k + R_c (R2 >= 0.991): k 0.7-3.8 W/mK, R_c
    4.2-28.3 mm2K/W, BLT 29-266 um at 139 kPa. Good greases sit below Blazej's
    2003 floor. Degradation shown as acoustic images only (no numbers).
  kb: ["12.6"]

- key: yeh2001
  cite: C. L. Yeh, C. Y. Wen, Y. F. Chen, S. H. Yeh & C. H. Wu, "An experimental investigation of thermal contact conductance across bolted joints", Exp. Therm. Fluid Sci. 25, 349-357 (2001)
  status: full
  topics: [bolted joint, Al 6061, contact pressure, pressure film, flatness, RTV]
  findings: >
    Bolted Al 6061 blocks in air; only correlations, no slopes or hardness:
    h = 1.35 + 0.21 P^2.8 (4 bolts), 9.04 + 0.1 P^3.79 (8 bolts), kW/m2K with P
    in MPa; 8 bolts beat 4 at the same mean pressure. CMY at their mean
    pressure is 5-35x too high: real contact is confined near the bolts.
    Not usable for CMY validation; the reason for the clamping check.
  kb: ["12.4"]

- key: fanmanson2008
  cite: G. Fan & J. R. Manson, "Calculations of the Energy Accommodation Coefficient for Gas-Surface Interactions", arXiv:0804.2269
  status: full
  topics: [accommodation coefficient, helium, neon, classical scattering, quantum gas]
  findings: >
    Classical theory with trapping-desorption fits Ar, Kr, Xe on clean W; for
    He and Ne it predicts values much too large (stated in Sec. III, not in the
    abstract). Basis of the MD_ACCOMMODATION_QUANTUM_GAS flag direction.
  kb: ["8.2", "12.7"]

