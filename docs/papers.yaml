# ---- machine learning for interface thermal resistance (surveyed 28 Oct) -------------
- key: khot2025
  cite: K. Khot, B. Xiao, Z. Han, Z. Guo, Z. Xiong & X. Ruan, "Phonon local non-equilibrium at Al/Si interface from machine learning molecular dynamics", J. Appl. Phys. 137, 115301 (2025)
  status: partial
  topics: [Al/Si, DeePMD, neural-network potential, MEAM bias, NEMD, electron-phonon, Tier 2]
  used_for: md/measured.py BIASES (Al/Si MEAM caution)
  findings: >
    DeePMD potential trained on DFT for bulk Al, bulk Si and the interface;
    NEMD with size extrapolation and the electron-phonon part subtracted gives
    380 +- 33 MW/m2K at 300 K, against ~350 consensus and 379 by TDTR. A
    classical 2NN MEAM over-estimates by 20-30 %. Our Jelinek MEAM plumbing run
    (445 +- 173) sits on that side; whether their MEAM is the same
    parameterisation is not verified. The obvious Tier-2 route for Si/Al.
  kb: ["15"]

- key: wu2020itrdata
  cite: Y.-J. Wu, T. Zhan, Z. Hou, L. Fang & Y. Xu, "Physical and chemical descriptors for predicting interfacial thermal resistance", Sci. Data 7, 36 (2020); data Zenodo 10.5281/zenodo.3564173 (CC BY 4.0)
  status: full
  topics: [dataset, interfacial thermal resistance, measured, descriptors, machine learning]
  used_for: md/measured.py import_nims (column layout from their Table 1)
  findings: >
    1,318 measured ITR points, 457 interface samples, 54 materials, 87 papers;
    columns include interlayer, temperature, method, film preparation and
    thickness, so the conditions travel with each value. Descriptors for
    298 materials (the abstract says 289). ITR in 1e-9 m2K/W. In the released
