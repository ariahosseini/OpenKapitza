- key: gordiz2016
  cite: 'K. Gordiz & A. Henry, "Phonon Transport at Crystalline Si/Ge Interfaces: The Role of Interfacial Modes of Vibration", Sci. Rep. 6, 23139 (2016)'
  status: full
  topics: [Si/Ge, Tersoff, ICMA, interfacial modes, anharmonicity, quantum correction]
  findings: >
    Six localised interface modes at 12-13 THz (above Ge's ~10 THz cutoff,
    <0.1 % of modes) carry ~15 % of the conductance (~12 % at 300 K after
    quantum correction); interface ~23 % anharmonic vs <7 % in the bulk. Their
    contribution is inelastic, so harmonic DMM/AGF cannot see it.
  kb: ["22"]

- key: hu2022thermostat
  cite: S. Hu, C. Y. Zhao & X. Gu, "Impact of thermostat on interfacial thermal conductance prediction from non-equilibrium molecular dynamics simulations", Chin. Phys. B 31, 056301 (2022)
  status: partial
  topics: [thermostat, Langevin, Nose-Hoover, reservoir non-equilibrium, NEMD]
  findings: >
    Langevin gives larger ITC than Nose-Hoover; under Nose-Hoover reservoir
    acoustic phonons lag optical ones, suppressing low-to-mid-frequency flux,
    with a strong reservoir-size effect; larger reservoirs or rough walls help
    but do not fully fix it. The literature mechanism behind our HEX-vs-Langevin
    finding on the bonded Si/Ge cell (KB 19).
  kb: ["19", "22"]

- key: li2019thermostat
  cite: Z. Li, S. Xiong, C. Sievers, Y. Hu, Z. Fan, N. Wei, H. Bao, S. Chen, D. Donadio & T. Ala-Nissila, "Influence of thermostatting on nonequilibrium molecular dynamics simulations of heat conduction in solids", J. Chem. Phys. 151, 234105 (2019); arXiv:1905.11024
  status: full
  topics: [thermostat, Langevin, Nose-Hoover chain, damping, boundaries, graphene]
  findings: >
    Langevin controls bath temperature far better than a Nose-Hoover chain,
    which over/undershoots near fixed boundaries and is non-ergodic with few
    DOF; recommended Langevin damping 0.1-1 ps for conductivity. Jumps at the
    bath edges are physical (phonon non-equilibrium); for ballistic
    conductance use the source-sink difference.
  kb: ["22"]

- key: olarteplata2022
  cite: J. D. Olarte-Plata & F. Bresme, "The impact of the thermostats on the non-equilibrium computer simulations of the interfacial thermal conductance", Mol. Simul. 48, 87-98 (2022)
  status: partial
  topics: [thermostat, Langevin damping, gold-water, polarisable model]
  findings: >
    Short local-Langevin damping alters the solid's vibrational DOS and raises
    the ITC by up to 40 %; ITC converges once damping exceeds the solid's
    heat-flux relaxation time. Global velocity rescaling is damping-independent
    but breaks equipartition for Drude particles. Our 0.1 ps is at the short
    edge (tracker P1-17).
  kb: ["22"]

- key: poulos2025heatflux
  cite: M. Poulos, D. Surblys & K. Termentzidis, "Exact heat flux formula and its spectral decomposition in molecular dynamics for arbitrary many-body potentials", arXiv:2509.26044 (2025)
  status: full
  topics: [heat flux, many-body, Tersoff, SW, centroid stress, LAMMPS, Green-Kubo]
  findings: >
    LAMMPS's group (equal-share) stress heat flux is exact only for pair
    potentials; for Tersoff/SW it under-estimates GK kappa (graphene ~1100 vs
    ~2713 W/mK, hBN ~45 % low, SW TMDs ~20 %; c-Si about right). NEMD from
    thermostat energy exchange is the exact reference. Their centroid form is
    implemented for Tersoff and SW only.
  kb: ["20", "22"]

- key: fan2015heatcurrent
  cite: Z. Fan, L. F. C. Pereira, H.-Q. Wang, J.-C. Zheng, D. Donadio & A. Harju, "Force and heat current formulas for many-body potentials in molecular dynamics simulation with applications to thermal conductivity calculations", Phys. Rev. B 92, 094301 (2015); arXiv:1503.06565
  status: partial
  topics: [heat current, many-body, Tersoff, GPUMD]
  findings: >
    Pairwise force decomposition for many-body potentials and the heat current
    that follows; deviates from the two-body stress-based form; validated on
    Tersoff Si, diamond, graphene, nanotubes. Basis of GPUMD's heat current.
  kb: ["20", "22"]

- key: turney2009quantum
  cite: J. E. Turney, A. J. H. McGaughey & C. H. Amon, "Assessing the applicability of quantum corrections to classical thermal conductivity predictions", Phys. Rev. B 79, 224305 (2009)
  status: partial
  topics: [quantum correction, silicon, thermal conductivity]
  findings: >
    For crystalline Si, applying quantum corrections to classical kappa (with
    or without zero-point energy) does not bring it closer to quantum
    predictions; uncorrected classical values fit better above ~200 K;
    conductivity cannot be quantum-corrected at the system level.
  kb: ["3", "22"]

- key: xu2025roughsial
  cite: (Xu & Guo, Harbin Inst. Technol.), "Uncovering the roughness effect on inelastic phonon scattering and thermal conductance at interface via spectral energy exchange", arXiv:2504.04696 (2025)
  status: partial
  topics: [Si/Al, ADP potential, roughness, inelastic, spectral, quantum correction]
  findings: >
    ADP chosen over MEAM for better Si and Al dispersion. A 1.4 nm amorphous
    SixAl1-x layer enhances <3.5 THz transport and inelastic scattering below
    ~3 THz; rough-interface ITC saturates 300-450 K. Uncorrected MD
    over-estimates below ~200 K; spectrally corrected ITC matches experiment.
  kb: ["22"]

- key: hua2017transmission
  cite: C. Hua, X. Chen, N. K. Ravichandran & A. J. Minnich, "Experimental metrology to obtain thermal phonon transmission coefficients at solid interfaces", arXiv:1612.08401 (Phys. Rev. B 95, 205423, 2017)
  status: full
  topics: [Al/Si, spectral transmission, TDTR, native oxide, validation target]
  findings: >
    Clean Al/Si 280 +- 10 MW/m2K; longitudinal transmission near the detailed-
    balance maximum below ~4-6 THz, falling to ~0 near 10 THz; native and
    thermal oxide lower it. A spectral target for MD, not just a total.
  kb: ["22"]

