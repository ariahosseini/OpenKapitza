# Interstitial gas properties, SI units throughout.
#
# ---------------------------------------------------------------------------
# VERIFICATION STATUS -- all entries are marked `verified: false`.
#
# gamma, Pr and M are standard and likely correct. The Sutherland constants
# for viscosity and thermal conductivity are engineering-handbook values
# entered from memory and NOT checked against a primary source; Sutherland's
# form in particular is a poor fit for helium and hydrogen, where it can be
# several percent off over a wide temperature span.
#
# The mean free path is computed from viscosity via kinetic theory
#     Lambda = (mu / P) * sqrt(pi * R_specific * T / 2)
# rather than from a tabulated collision diameter, because viscosity data is
# better established and the relation is exact within the hard-sphere model.
# ---------------------------------------------------------------------------

air:
  name: Dry air
  verified: false
  M: 28.97e-3           # kg/mol
  gamma: 1.400
  Pr: 0.71
  mu_ref: 1.716e-5      # Pa*s at T_ref
  mu_T_ref: 273.15      # K
  mu_S: 110.4           # K, Sutherland constant for viscosity
  k_ref: 0.0241         # W/(m*K) at T_ref
  k_T_ref: 273.15
  k_S: 194.0            # K, Sutherland constant for conductivity

N2:
  name: Nitrogen
  verified: false
  M: 28.014e-3
  gamma: 1.400
  Pr: 0.69
  mu_ref: 1.663e-5
  mu_T_ref: 273.15
  mu_S: 107.0
  k_ref: 0.0242
  k_T_ref: 273.15
  k_S: 150.0
  # gamma and Pr verified against Song & Yovanovich (1988) Table 1:
  # gamma = 1.41, Pr = 0.69. Pr was 0.72 here, now corrected.

He:
  name: Helium
  verified: false
  M: 4.0026e-3
  gamma: 1.667
  Pr: 0.67
  mu_ref: 1.865e-5
  mu_T_ref: 273.15
  mu_S: 79.4
  k_ref: 0.1420
  k_T_ref: 273.15
  k_S: 79.4
  notes: >
    Sutherland's law fits helium poorly. Treat k(T) and mu(T) away from 273 K
    as accurate to a few percent at best. Helium's high conductivity and long
    mean free path make it the gas most likely to push the gap model into the
    rarefied regime, so check the M/Y flag.

Ar:
  name: Argon
  verified: false
  M: 39.948e-3
  gamma: 1.667
  Pr: 0.67
  mu_ref: 2.125e-5
  mu_T_ref: 273.15
  mu_S: 144.0
  k_ref: 0.0163
  k_T_ref: 273.15
  k_S: 170.0

H2:
  name: Hydrogen
  verified: false
  M: 2.016e-3
  gamma: 1.405
  Pr: 0.70
  mu_ref: 8.411e-6
  mu_T_ref: 273.15
  mu_S: 97.0
  k_ref: 0.168
  k_T_ref: 273.15
  k_S: 120.0
  notes: Sutherland fit is poor, as for helium.


# ---------------------------------------------------------------------------
# Thermal accommodation coefficients.
#
# Still the weakest numbers in the gap model, but no longer guesses for the
# pairs below. Song & Yovanovich (1989), "Contact Interface Gas Heat
# Transfer: A Method of Measuring Thermal Accommodation Coefficient", 9th
# Annual International Electronics Packaging Conference, Vol. 2, pp. 925-936,
# Table 2, reports least-square regression estimates from gap-conductance
# measurements on the SAME bead-blasted SS 304 and Ni 200 specimens the
# benchmark data comes from:
#
#              Exp 1 (SS)  Exp 2 (SS)  Exp 3 (Ni)  Exp 4 (Ni)
#     He          0.67        0.58        0.61        0.60
#     Ar          0.96        0.88        0.93        0.87
#     N2          0.87        0.79        0.81        0.80
#
# The per-material values below are the means of the relevant pair.
#
# WHY THIS MATTERED. The previous helium default here was 0.30, taken from
# the clean-surface literature. Table 3 of the same paper tabulates published
# helium values from 0.327 (Zircaloy-2) to 0.65 (silver), confirming that
# spread is real -- but ENGINEERING surfaces, bead-blasted and air-exposed,
# accommodate far better than outgassed laboratory ones. Since
# alpha = (2-a1)/a1 + (2-a2)/a2, moving helium from 0.30 to 0.61 changes the
# rarefaction parameter M by a factor of 1.9, which moves h_g directly
# wherever the gap is rarefied.
#
# A measured value for YOUR surface still beats any of these. Entries without
# a measured source keep the old mid-range defaults and remain flagged.
# ---------------------------------------------------------------------------
accommodation_defaults:
  verified: false
  source: >
    Song & Yovanovich (1989), 9th Annual Int. Electronics Packaging Conf.,
    Vol. 2, pp. 925-936, Table 2 (least-square regression estimates on
    bead-blasted SS 304 and Ni 200).
  # keyed by gas, then by solid; `default` applies when the pair is absent
  He:
    default: 0.45        # mid-range of the published spread; unmeasured pairs
    SS304: 0.63          # measured, mean of Exp 1 and 2
    Ni200: 0.61          # measured, mean of Exp 3 and 4
    Si: 0.30             # NOT measured; clean-surface literature value
    Al: 0.30             # NOT measured
    Cu: 0.30             # NOT measured
  H2:
    default: 0.35        # NOT measured
  N2:
    default: 0.80
    SS304: 0.83          # measured
    Ni200: 0.81          # measured
  air:
    default: 0.85        # NOT measured; air is not one of the tested gases
  Ar:
    default: 0.90
    SS304: 0.92          # measured
    Ni200: 0.90          # measured
  _fallback: 0.80
