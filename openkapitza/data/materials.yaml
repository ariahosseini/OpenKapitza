Al:
  name: Aluminium (pure, annealed)
  phase: crystalline
  verified: false
  k: 237.0
  rho: 2710.0
  E: 70.0e9
  nu: 0.35
  v_long: 6350.0
  v_trans: 3100.0
  theta_debye: 428.0
  number_density: 6.05e28   # atoms/m^3; rho/M * N_A, M = 26.982 g/mol, rho 2710
  Hv: 0.35e9            # Pa; VERY processing dependent, 0.2-1.2 GPa range
  c1: null
  c2: null
  notes: >
    Work-hardens heavily under indentation, so a single Hv is a poor summary.
    Alloys (6061, 2024) are several times harder than pure annealed Al.
  sources:
    k: >-
      Thermal conductivities of the elements (Wikipedia data page; CRC/WebElements columns), usable value at ~300 K
    rho: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957)
    nu: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957) (computed there from the speeds: 0.35)
    v_long: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957)
    v_trans: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957)
    theta_debye: >-
      Kittel, Introduction to Solid State Physics, 8th ed. (2004), Debye temperature table (as reproduced on Wikipedia 'Debye model')
    Hv: >-
      Hardnesses of the elements (Wikipedia data page; primary reference Samsonov, Handbook of the physicochemical properties of the elements, 1968): Vickers 160-350 MPa for Al; the value here is the top of that range and pretreatment moves it by several hundred percent

Al6061:
  name: Aluminium alloy 6061-T6
  phase: crystalline
  verified: false
  # Heat sinks, cold plates and enclosures. k, rho, E, nu are typical handbook
  # values NOT yet checked against a source here; sound speeds, Debye
  # temperature and number density are pure Al's (proxy for the DMM only).
  k: 167.0
  rho: 2700.0
  E: 68.9e9
  nu: 0.33
  v_long: 6350.0
  v_trans: 3100.0
  theta_debye: 428.0
  number_density: 6.03e28   # atoms/m^3; treated as Al, M = 26.982 g/mol, rho 2700
  Hv: 0.915e9           # Pa; BRINELL 915 MPa at 22 C (no Vickers bulk value in the source)
  c1: 1.123e9           # Pa
  c2: -0.0079           # almost no size effect: Al 6061-T6 does not work-harden like SS/Ni
  hardness_coefficients_source: >
    Bahrami, Yovanovich & Culham, 'Micro and Macro Hardness Measurements, Correlations, and Contact Models', AIAA 2004-0989, Table 10 (after Nho 1990): c1(23.7 C) = 1123 MPa with c2 = -0.0079. Bahrami's 2004 thesis Table A.39 uses 0.9 GPa / -0.006 for Nho's own specimens.
  # Hot Vickers (Nho), 24-183 C; not applied by default (see SS304).
  c1_temperature: {C_T: -1.190e-3, T_ref: 296.85, T_max: 456.15}
  notes: >
    Nho's vacuum joint data (Al 6061-T6 and Al 6061-T6 / Ni 200, Bahrami 2004
    thesis Tables A.66-A.71) are in tests/benchmarks/joint_conductance_ext.csv.
  sources:
    Hv: >-
      Bahrami, Yovanovich & Culham, AIAA 2004-0989, Table 9 (after Nho): Brinell 915 MPa at 22.3 C, 500 kg, 10 mm ball; used as the bulk-hardness proxy
    c1_temperature: >-
      Bahrami, Yovanovich & Culham, AIAA 2004-0989, Table 10 (after Nho 1990): 10^3 C_T = -1.190 /C, T_max 183 C

