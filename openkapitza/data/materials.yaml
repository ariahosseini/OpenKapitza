# Solid material properties, SI units throughout.
#
# ---------------------------------------------------------------------------
# VERIFICATION STATUS -- READ THIS BEFORE TRUSTING ANY NUMBER HERE.
#
# Verification is PER FIELD (open issue P0-6, 23 Oct 2026). A field listed
# under an entry's `sources:` was checked against the source named there and
# loads with MEDIUM confidence and that citation; every other field is still
# an unverified starting value (LOW confidence, named in the load-time flag).
# An entry's `verified` is true only when k, rho, E, nu and Hv are all sourced.
#
# Reliability varies sharply by field:
#   k, rho, E, nu, v_long, v_trans, theta_debye
#       -- standard handbook properties, likely close to correct, but still
#          unverified here and in several cases anisotropic values reduced to
#          a single polycrystalline-ish number.
#   Hv  -- MOST SUSPECT FIELD. Microhardness depends strongly on processing,
#          surface finish, indenter load and work hardening. The values below
#          are rough mid-range figures and can be wrong by a factor of 2+ for
#          a specific sample. Always prefer the user's own indentation data.
#   c1, c2 (Song-Yovanovich Vickers correlation coefficients)
#       -- deliberately left null. These are fitted per material from
#          load-dependent indentation data and are NOT safely guessable.
#          With them absent the code falls back to H_c = Hv and flags it.
# ---------------------------------------------------------------------------

Si:
  name: Silicon (single crystal)
  phase: crystalline
  verified: false
  k: 149.0  # W/(m*K) at ~300 K
  rho: 2329.0           # kg/m^3
  E: 162.5e9  # Pa; Hill average of Voigt 165.6 / Reuss 159.4 (anisotropic: 130-188)
  nu: 0.223  # Hill average of Voigt 0.218 / Reuss 0.228
  v_long: 8433.0  # m/s; [100] value sqrt(C11/rho), NOT an isotropic average
  v_trans: 5843.0  # m/s; [100] value sqrt(C44/rho)
  theta_debye: 645.0    # K
  number_density: 5.00e28   # atoms/m^3; rho/M * N_A, M = 28.085 g/mol
  Hv: 11.0e9            # Pa, rough; brittle, indentation-size dependent
  c1: null
  c2: null
  notes: >
    Elastic constants are direction dependent; the single E/nu pair here is an
    approximation adequate for a plasticity-index screen, not for a stress
    analysis.
  sources:
    k: >-
      Thermal conductivities of the elements (Wikipedia data page; CRC/WebElements columns), usable value at ~300 K
    E: >-
      A. George, 'Elastic constants and moduli of diamond cubic Si', EMIS Datareview (1997), Hall's C11 165.64, C12 63.94, C44 79.51 GPa at 298 K; E, nu = Hill mean of the Voigt and Reuss averages given there
    nu: >-
      A. George, 'Elastic constants and moduli of diamond cubic Si', EMIS Datareview (1997), Hall's C11 165.64, C12 63.94, C44 79.51 GPa at 298 K
    v_long: >-
      A. George, 'Elastic constants and moduli of diamond cubic Si', EMIS Datareview (1997), Hall's C11 165.64, C12 63.94, C44 79.51 GPa at 298 K; sqrt(C11/rho) = 8433 m/s
    v_trans: >-
      A. George, 'Elastic constants and moduli of diamond cubic Si', EMIS Datareview (1997), Hall's C11 165.64, C12 63.94, C44 79.51 GPa at 298 K; sqrt(C44/rho) = 5843 m/s
    theta_debye: >-
      Kittel, Introduction to Solid State Physics, 8th ed. (2004), Debye temperature table (as reproduced on Wikipedia 'Debye model')

