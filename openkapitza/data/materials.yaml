SiO2:
  name: Silica (fused / amorphous)
  phase: amorphous
  verified: false
  k: 1.30
  rho: 2201.0
  E: 72.7e9
  nu: 0.16
  v_long: 5934.0  # m/s; from Corning E, G and rho: sqrt((K + 4G/3)/rho)
  v_trans: 3777.0  # m/s; sqrt(G/rho), G = 31.4 GPa
  theta_debye: 470.0    # K; ill-defined for a glass, used only for the
  number_density: 6.61e28   # atoms/m^3; 3 atoms per SiO2 unit, M = 60.08 g/mol
                        # quantum-effects screen, never for transport
  Hv: 5.12e9  # Pa; KNOOP 522 kg/mm^2 at 100 g (no Vickers value in the source); was 8.9 GPa, a nanoindentation-scale number
  c1: null
  c2: null
  notes: >
    Debye temperature is not strictly meaningful for an amorphous solid. It is
    retained only as a rough scale for the low-temperature quantum warning, and
    any model that uses it for transport should be treated as unreliable.
  sources:
    k: >-
      Corning, 'HPFS Fused Silica Industrial Grade' (Oct 2008), values at 25 C
    rho: >-
      Corning, 'HPFS Fused Silica Industrial Grade' (Oct 2008), values at 25 C
    E: >-
      Corning, 'HPFS Fused Silica Industrial Grade' (Oct 2008), values at 25 C
    nu: >-
      Corning, 'HPFS Fused Silica Industrial Grade' (Oct 2008), values at 25 C
    v_long: >-
      Corning, 'HPFS Fused Silica Industrial Grade' (Oct 2008), values at 25 C; derived from E 72.7, G 31.4 GPa, rho 2201
    v_trans: >-
      Corning, 'HPFS Fused Silica Industrial Grade' (Oct 2008), values at 25 C; derived, sqrt(G/rho)
    Hv: >-
      Corning, 'HPFS Fused Silica Industrial Grade' (Oct 2008), values at 25 C: Knoop hardness 522 kg/mm^2 (100 g). Knoop, not Vickers

SS304:
  name: Stainless steel 304
  phase: crystalline
  verified: false
  k: 16.2
  rho: 7900.0  # kg/m^3; 304L in the source
  E: 193.0e9
  nu: 0.29
  v_long: 5640.0  # m/s; 304L
  v_trans: 3070.0  # m/s; 304L
  theta_debye: 470.0  # K; IRON's value (no SS304 value found); was 477
  number_density: 8.52e28   # atoms/m^3; treated as Fe, M = 55.845 g/mol, rho 7900
  Hv: 2.0e9             # Pa; 1.5-2.5 GPa typical, cold work raises it
  # Fitted Vickers correlation coefficients, HV = c1*(dV/d0)^c2, d0 = 1 um.
  # These are measured fits, not estimates, and are the single biggest
  # improvement available to the contact model for this material.
  c1: 6.271e9           # Pa
  c2: -0.229
  hardness_coefficients_source: >
    Bahrami, Yovanovich & Culham, 'Micro and Macro Hardness Measurements, Correlations, and Contact Models', AIAA 2004-0989, Table 3 (fitted values; checked against the paper 23 Oct 2026).
  # Hot Vickers (Nho): c1(T)/c1(T_rm) = exp[C_T (T - T_rm)], 25 C <= T <= 190 C.
  # NOT applied by default: on Hegazy's 125-145 C joints (our benchmark) room-
  # temperature c1 matches (pred/meas 1.03) and the softened c1 over-predicts (1.23).
  c1_temperature: {C_T: -1.675e-3, T_ref: 298.35, T_max: 463.15}
  notes: >
    A common thermal-contact-conductance benchmark material. Published
    Yovanovich-style joint conductance data exists for SS/SS pairs in vacuum
    and in gas, which is why it is included here.
  sources:
    rho: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957), stainless steel 304L
    nu: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957), 304L (0.29)
    v_long: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957), 304L
    v_trans: >-
      Coppens & Wilson, 'Elements of Sound Transmission in Beams', NPS-61-79-004 (1978), Table 1, after Ewing, Jardetzky & Press (1957), 304L
    theta_debye: >-
      Kittel, Introduction to Solid State Physics, 8th ed. (2004), Debye temperature table (as reproduced on Wikipedia 'Debye model'): Fe, used as a proxy
    c1_temperature: >-
      Bahrami, Yovanovich & Culham, AIAA 2004-0989, Table 10 (after Nho 1990): c1(25.2 C) = 7339 MPa, 10^3 C_T = -1.675 /C, T_max 190 C, fitted with c2 = -0.279

